<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HOF Compliance Audit — Contacts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy:        #12266e;
  --navy-deep:   #0b1a52;
  --navy-mid:    #1e3a8a;
  --blue:        #2563eb;
  --blue-lt:     #3b82f6;
  --dxb:         #ea580c;
  --dxb2:        #dc2626;
  --bg:          #eef3ff;
  --surface:     #f4f7ff;
  --card:        #ffffff;
  --border:      #c7d7f5;
  --border-soft: #dce8fb;
  --text:        #0f1c4d;
  --muted:       #5a6a8e;
  --yes:         #16a34a;
  --no:          #dc2626;
  --na:          #d97706;
  --r:           10px;
  --font:        'Space Grotesk', sans-serif;
  --mono:        'Space Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

/* ─── HEADER ─────────────────────────────────── */
.hdr {
  height: 56px; flex-shrink: 0;
  background: var(--navy-deep);
  border-bottom: 2px solid var(--dxb);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; z-index: 200;
}
.hdr-brand { display: flex; align-items: center; gap: 11px; }
.hdr-badge {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, var(--dxb), var(--dxb2));
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.hdr-name { font-size: 13px; font-weight: 700; color: #fff; letter-spacing: .02em; }
.hdr-sub  { font-size: 10px; color: rgba(255,255,255,.4); text-transform: uppercase; letter-spacing: .07em; }
.hdr-right { display: flex; align-items: center; gap: 9px; }
.hpill {
  padding: 3px 11px; border-radius: 20px;
  font-size: 11px; font-weight: 700; letter-spacing: .05em; font-family: var(--mono);
}
.hpill.dxb  { background: rgba(234,88,12,.14); color: #fb923c; border: 1px solid rgba(234,88,12,.3); }
.hpill.live { background: rgba(22,163,74,.12); color: #4ade80; border: 1px solid rgba(22,163,74,.25); }
.btn-hdr {
  padding: 6px 16px; border-radius: 7px; border: none;
  background: linear-gradient(135deg, var(--dxb), var(--dxb2));
  color: #fff; font-family: var(--font); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: opacity .2s; display: flex; align-items: center; gap: 5px;
}
.btn-hdr:hover { opacity: .82; }

/* ─── PAGE BODY ──────────────────────────────── */
.page-body { display: flex; flex: 1; min-height: 0; overflow: hidden; }

/* ─── SIDEBAR ────────────────────────────────── */
.sidebar {
  width: 270px; flex-shrink: 0;
  background: var(--navy);
  display: flex; flex-direction: column;
  overflow-y: auto; padding: 22px 18px 20px;
}

.score-wrap { text-align: center; padding: 16px 0 14px; }
.score-ring { position: relative; width: 116px; height: 116px; margin: 0 auto 10px; }
.score-ring svg { width: 116px; height: 116px; transform: rotate(-90deg); }
.ring-bg   { fill: none; stroke: rgba(255,255,255,.1); stroke-width: 9; }
.ring-arc  { fill: none; stroke-width: 9; stroke-linecap: round;
             stroke-dasharray: 313; stroke-dashoffset: 0;
             transition: stroke-dashoffset .5s ease, stroke .4s ease; }
.score-inner {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.score-num {
  font-family: var(--mono); font-size: 32px; font-weight: 700; color: #fff; line-height: 1;
  transition: color .3s;
}
.score-denom { font-size: 10px; color: rgba(255,255,255,.38); margin-top: 1px; letter-spacing: .06em; }
.score-grade { font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 2px; }
.score-hint  { font-size: 10px; color: rgba(255,255,255,.4); }

.sb-section-label {
  font-size: 9px; font-weight: 700; letter-spacing: .15em;
  text-transform: uppercase; color: rgba(255,255,255,.3);
  margin: 16px 0 7px;
}
.chip-list { display: flex; flex-direction: column; gap: 5px; }
.sb-chip {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
  border-radius: 7px; padding: 6px 10px;
  font-size: 11px; color: rgba(255,255,255,.55);
  transition: all .2s;
}
.sb-chip.pass  { border-color: rgba(74,222,128,.28); color: rgba(255,255,255,.8); }
.sb-chip.pass .cp { color: #4ade80; }
.sb-chip.fail  { border-color: rgba(248,113,113,.28); }
.sb-chip.fail .cp { color: #f87171; }
.sb-chip.na-c  { border-color: rgba(251,191,36,.28); }
.sb-chip.na-c .cp { color: #fbbf24; }
.cp { font-family: var(--mono); font-size: 10px; font-weight: 700; }

.sb-actions { margin-top: auto; padding-top: 18px; display: flex; flex-direction: column; gap: 7px; }
.btn-sb-submit {
  width: 100%; padding: 11px;
  background: linear-gradient(135deg, var(--dxb), var(--dxb2));
  border: none; border-radius: 8px;
  color: #fff; font-family: var(--font); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: opacity .2s; display: flex; align-items: center; justify-content: center; gap: 7px;
}
.btn-sb-submit:hover { opacity: .84; }
.btn-sb-submit:disabled { opacity: .38; cursor: not-allowed; }
.btn-sb-reset {
  width: 100%; padding: 9px;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
  border-radius: 8px; color: rgba(255,255,255,.5);
  font-family: var(--font); font-size: 12px;
  cursor: pointer; transition: all .2s;
}
.btn-sb-reset:hover { background: rgba(255,255,255,.11); color: #fff; }
.btn-autofail {
  width: 100%; padding: 11px;
  background: rgba(220,38,38,.12); border: 1px solid rgba(220,38,38,.4);
  border-radius: 8px; color: #f87171;
  font-family: var(--font); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .2s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.btn-autofail:hover { background: rgba(220,38,38,.22); border-color: #f87171; color: #fca5a5; }
.btn-autofail.active {
  background: rgba(220,38,38,.28); border-color: #ef4444; color: #fff;
  box-shadow: 0 0 0 2px rgba(220,38,38,.35);
}
.autofail-notice {
  background: rgba(220,38,38,.1); border: 1px solid rgba(220,38,38,.35);
  border-radius: 7px; padding: 7px 10px;
  font-size: 10px; color: #f87171; text-align: center;
  font-weight: 600; letter-spacing: .04em;
  display: none;
}
.autofail-notice.show { display: block; }

/* ─── DEAL WASTED BUTTON (sidebar) ───────────── */
.btn-deal-wasted {
  width: 100%; padding: 11px;
  background: rgba(217,119,6,.14); border: 1px solid rgba(217,119,6,.5);
  border-radius: 8px; color: #fbbf24;
  font-family: var(--font); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .2s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.btn-deal-wasted:hover { background: rgba(217,119,6,.25); border-color: #fbbf24; color: #fde68a; }
.btn-deal-wasted:disabled { opacity: .5; cursor: not-allowed; }
.btn-deal-wasted.active {
  background: linear-gradient(135deg, #dc2626, #b45309); border-color: #ef4444; color: #fff;
  box-shadow: 0 0 0 2px rgba(220,38,38,.35);
}

/* ─── MAIN ───────────────────────────────────── */
.main { flex: 1; overflow-y: auto; padding: 24px 28px; }

.page-heading {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 20px; padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  gap: 14px;
}
.ph-text h1 { font-size: 18px; font-weight: 700; color: var(--navy); }
.ph-text h1 em { font-style: normal; color: var(--dxb); }
.ph-text p  { font-size: 12px; color: var(--muted); margin-top: 3px; }
.btn-top {
  flex-shrink: 0;
  padding: 9px 20px; border-radius: 8px; border: none;
  background: linear-gradient(135deg, var(--dxb), var(--dxb2));
  color: #fff; font-family: var(--font); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: opacity .2s; display: flex; align-items: center; gap: 6px;
}
.btn-top:hover { opacity: .85; }

.config-banner {
  background: #fffbeb; border: 1px solid #fcd34d;
  border-radius: 8px; padding: 9px 13px;
  font-size: 12px; color: #92400e;
  margin-bottom: 16px; display: none;
}
.config-banner.show { display: block; }

/* ─── SECTIONS ───────────────────────────────── */
.section {
  background: var(--card);
  border: 1px solid var(--border-soft);
  border-radius: var(--r);
  margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(18,38,110,.04);
  overflow: hidden;
}
.sec-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 15px;
  background: var(--surface);
  border-bottom: 1px solid var(--border-soft);
}
.sec-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--navy); }
.sec-icon  { font-size: 15px; }
.sec-pts   { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--yes); }
.sec-pts.z { color: var(--no); }
.sec-body  { padding: 13px 15px; }

/* ─── FIELDS ─────────────────────────────────── */
.field { margin-bottom: 13px; }
.field:last-child { margin-bottom: 0; }
label {
  display: block; font-size: 10px; font-weight: 700;
  color: var(--muted); margin-bottom: 5px;
  letter-spacing: .08em; text-transform: uppercase;
}
input[type=text], input[type=url], input[type=date], select, textarea {
  width: 100%; background: var(--surface);
  border: 1px solid var(--border); border-radius: 7px;
  color: var(--text); font-family: var(--font); font-size: 13px;
  padding: 8px 11px; outline: none;
  transition: border-color .2s, box-shadow .2s; appearance: none;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--blue-lt);
  box-shadow: 0 0 0 3px rgba(59,130,246,.1);
}
textarea { resize: vertical; min-height: 62px; }
select option { background: #fff; color: var(--text); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }

/* ─── YES/NO ─────────────────────────────────── */
.yn-group {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 12px;
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: 8px; margin-bottom: 6px;
  transition: border-color .2s, background .2s;
}
.yn-group:last-child { margin-bottom: 0; }
.yn-group.ay { border-color: rgba(22,163,74,.35); background: rgba(22,163,74,.04); }
.yn-group.an { border-color: rgba(220,38,38,.35);  background: rgba(220,38,38,.04); }
.yn-group.aa { border-color: rgba(217,119,6,.35);  background: rgba(217,119,6,.04); }
.yn-key  { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-right: 9px; flex-shrink: 0; }
.yn-lbl  { font-size: 12px; font-weight: 500; color: var(--text); flex: 1; }
.yn-btns { display: flex; gap: 5px; }
.yn-btn {
  border: 1px solid var(--border); background: var(--card);
  border-radius: 6px; padding: 4px 13px;
  font-size: 11px; font-weight: 600; cursor: pointer;
  color: var(--muted); font-family: var(--font); transition: all .15s;
}
.yn-btn:hover { border-color: var(--navy); color: var(--navy); }
.yn-btn.yes.active { background: rgba(22,163,74,.09); border-color: var(--yes); color: var(--yes); }
.yn-btn.no.active  { background: rgba(220,38,38,.09); border-color: var(--no);  color: var(--no); }
.yn-btn.na.active  { background: rgba(217,119,6,.09); border-color: var(--na);  color: var(--na); }
.yn-btn.af {
  border-color: rgba(220,38,38,.35); color: rgba(220,38,38,.7);
  font-size: 10px; padding: 4px 9px; margin-left: 3px;
}
.yn-btn.af:hover { border-color: #dc2626; color: #dc2626; background: rgba(220,38,38,.07); }
.yn-btn.af.active {
  background: rgba(220,38,38,.18); border-color: #ef4444; color: #ef4444;
  font-weight: 700; box-shadow: 0 0 0 2px rgba(220,38,38,.25);
}
.yn-group.aaf { border-color: rgba(220,38,38,.6) !important; background: rgba(220,38,38,.06) !important; }
.yn-group.aaf .yn-lbl { color: #dc2626; }

.na-notice {
  font-size: 11px; color: var(--na);
  background: rgba(217,119,6,.06); border: 1px solid rgba(217,119,6,.2);
  border-radius: 6px; padding: 5px 10px;
  margin-top: 6px; display: none;
}
.na-notice.show { display: block; }

/* ─── BOTTOM ACTIONS ─────────────────────────── */
.bottom-wrap { display: flex; gap: 9px; margin-top: 18px; flex-wrap: wrap; }
.btn-submit {
  flex: 1; padding: 12px 18px; border: none; border-radius: 9px;
  background: linear-gradient(135deg, var(--dxb), var(--dxb2));
  color: #fff; font-family: var(--font); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: opacity .2s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.btn-submit:hover   { opacity: .86; }
.btn-submit:disabled { opacity: .38; cursor: not-allowed; }
.btn-reset {
  padding: 12px 17px; background: var(--card);
  border: 1px solid var(--border); border-radius: 9px;
  color: var(--muted); font-family: var(--font); font-size: 12px;
  cursor: pointer; transition: all .2s;
}
.btn-reset:hover { border-color: var(--navy); color: var(--navy); }

/* ─── TOAST ──────────────────────────────────── */
.toast {
  position: fixed; bottom: 22px; left: 50%;
  transform: translateX(-50%) translateY(90px);
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 11px 18px;
  font-size: 13px; font-weight: 500;
  box-shadow: 0 8px 28px rgba(18,38,110,.13);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  z-index: 300; min-width: 230px; text-align: center;
}
.toast.show    { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--yes); color: var(--yes); }
.toast.error   { border-color: var(--no);  color: var(--no); }

/* ─── DEAL WASTED CONFIRM MODAL ─────────────── */
.modal-bg {
  position: fixed; inset: 0; background: rgba(11,26,82,.55);
  display: none; align-items: center; justify-content: center;
  z-index: 400; padding: 20px;
}
.modal-bg.show { display: flex; }
.modal-box {
  background: var(--card); border-radius: 12px; padding: 22px 24px;
  max-width: 420px; width: 100%;
  box-shadow: 0 18px 50px rgba(11,26,82,.3);
}
.modal-title { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.modal-text  { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
.modal-link  { font-family: var(--mono); font-size: 11px; color: var(--navy); background: var(--surface); padding: 8px 10px; border-radius: 6px; word-break: break-all; margin-bottom: 16px; border: 1px solid var(--border-soft); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.btn-modal {
  padding: 9px 16px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--card); color: var(--muted);
  font-family: var(--font); font-size: 12px; font-weight: 600; cursor: pointer;
  transition: all .15s;
}
.btn-modal:hover { border-color: var(--navy); color: var(--navy); }
.btn-modal.primary {
  background: linear-gradient(135deg, #d97706, #b45309);
  border-color: transparent; color: #fff;
}
.btn-modal.primary:hover { opacity: .88; color: #fff; }
.btn-modal:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-brand">
    <div class="hdr-badge">⬡</div>
    <div>
      <div class="hdr-name">HOF · Compliance Audit</div>
      <div class="hdr-sub">Sales Call Quality Assurance</div>
    </div>
  </div>
  <div class="hdr-right">
    <span class="hpill dxb">🎧 SALES CALL QA</span>
    <span class="hpill live">● LIVE</span>
    <button class="btn-hdr" onclick="submitAudit()">⬆ Submit Audit</button>
  </div>
</header>

<div class="page-body">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="score-wrap">
      <div class="score-ring">
        <svg viewBox="0 0 116 116">
          <circle class="ring-bg"  cx="58" cy="58" r="49.8"/>
          <circle class="ring-arc" cx="58" cy="58" r="49.8" id="ring-arc"/>
        </svg>
        <div class="score-inner">
          <span class="score-num" id="total-score">100</span>
          <span class="score-denom">/ 100</span>
        </div>
      </div>
      <div class="score-grade" id="score-grade" style="color:#4ade80;">PERFECT</div>
      <div class="score-hint"  id="score-hint">All attributes passing</div>
    </div>

    <div class="sb-section-label">Attribute Weightage</div>
    <div class="chip-list" id="chipList"></div>

    <div class="sb-actions">
      <button class="btn-sb-submit" id="submitBtn" onclick="submitAudit()">⬆ Submit to Sheet</button>
      <button class="btn-sb-reset" onclick="resetForm()">↺ Reset Form</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="page-heading">
      <div class="ph-text">
        <h1>Sales <em>Call QA</em></h1>
        <p>Mark No on any attribute to deduct its weightage from the live score on the left.</p>
      </div>
      <button class="btn-top" onclick="submitAudit()">⬆ Submit Audit to Sheet</button>
    </div>

    <div class="config-banner" id="config-banner">⚠ Apps Script URL not configured.</div>

    <!-- CALL INFO -->
    <div class="section">
      <div class="sec-hdr"><div class="sec-title"><span class="sec-icon">◈</span> Call Information</div></div>
      <div class="sec-body">
        <div class="row2">
          <div class="field">
            <label>Consultant Name *</label>
            <select id="consultantName" required>
              <option value="">— Select Consultant —</option>
              <option>Mishal Fatima Bashir</option>
              <option>Rabbiya Mohsin</option>
              <option>Muhammad Diean</option>
              <option>Muhammad Shahzad Fiaz</option>
              <option>Fatima Zahid</option>
              <option>Ayesha Zahid</option>
              <option>Syed Hussain Ali Haris</option>
              <option>Ahmad Ali</option>
              <option>Ali Raza Qureshi</option>
              <option>Mishal Naseem</option>
              <option>Hamza Manzoor</option>
              <option>Atika Zainab</option>
              <option>Fahad Waseem</option>
              <option>Muhammad Momin Ashfaq</option>
              <option>Hamad Ahmad</option>
              <option>Haleema Umar</option>
              <option>Rida Faisal</option>
              <option>Aiman Ali</option>
              <option>Muhammad Awaad bin Imran</option>
              <option>Muhammad Hanzla</option>
              <option>Tuba Ahmed</option>
            </select>
          </div>
          <div class="field">
            <label>Auditor Name *</label>
            <select id="auditorName" required>
              <option value="">— Select Auditor —</option>
              <option>Haris</option>
            </select>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label>Audit Date *</label><input type="date" id="auditDate"/></div>
          <div class="field"><label>Ziwo ID *</label><input type="text" id="ziwoId" placeholder="e.g. 24815"/></div>
        </div>
        <div class="field">
          <label>HubSpot Link *</label>
          <input type="url" id="hubspotLink" placeholder="https://app.hubspot.com/contacts/..."/>
        </div>
        <div class="row2">
          <div class="field"><label>Call Duration *</label><input type="text" id="callDuration" placeholder="e.g. 12:45"/></div>
          <div class="field"><label>Comments / Observations</label><input type="text" id="comments" placeholder="Optional notes..."/></div>
        </div>
      </div>
    </div>

    <!-- ATTRIBUTES (rendered from ATTRIBUTES) -->
    <div id="sectionsContainer"></div>

    <div class="bottom-wrap">
      <button class="btn-reset" onclick="resetForm()">↺ Reset</button>
      <button class="btn-submit" onclick="submitAudit()">⬆ Submit Audit to Sheet</button>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<style>
.wt-badge {
  font-family:'Space Mono',monospace; font-size:11px; font-weight:700;
  background:#eef2ff; color:#4338ca; border:1px solid #c7d2fe;
  border-radius:6px; padding:3px 8px; white-space:nowrap;
}
.sec-hdr-right { display:flex; align-items:center; gap:9px; }
</style>

<script>
// ══════════════════════════════════════════════════════════
// CONFIG — SALES CALL QA
// ⚠ PASTE THE SALES-QA WEB-APP URL BELOW (from its Apps Script deployment).
// ══════════════════════════════════════════════════════════
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3x_NPlRgy2QTcRz7_K4yX9Y8G39sBcKT-wtXSwZhjg-d2lrS-8C9NbP2IAe4qyyCrYg/exec";
const TEAM = "SALES QA";

// Table 2 — Attribute Weightage (totals 100%)
const ATTRIBUTES = [
  { id:'opening',     n:1,  icon:'👋', name:'Opening & Context',                pts:8,
    desc:'Proper introduction and call context set' },
  { id:'jobVerify',   n:2,  icon:'🧾', name:'Job Responsibilities Verification', pts:10,
    desc:'Job role and responsibilities verified' },
  { id:'rapport',     n:3,  icon:'🤝', name:'Rapport',                          pts:10,
    desc:'Rapport built and maintained with the lead' },
  { id:'discovery',   n:4,  icon:'🔍', name:'Discovery & Qualification',        pts:15,
    desc:'Needs discovered and lead properly qualified' },
  { id:'valueAlign',  n:5,  icon:'💡', name:'Value & Solution Alignment',       pts:15,
    desc:'Value proposition aligned to the lead\'s profile' },
  { id:'etiquette',   n:6,  icon:'🗣️', name:'Communication Etiquette',          pts:12,
    desc:'Tone, clarity and professional etiquette maintained' },
  { id:'deadAir',     n:7,  icon:'⏱️', name:'Dead Air & Call Control',          pts:8,
    desc:'No excessive dead air; call kept under control' },
  { id:'objection',   n:8,  icon:'🛡️', name:'Objection Handling',               pts:10,
    desc:'Objections handled confidently and accurately' },
  { id:'closing',     n:9,  icon:'✅', name:'Closing & Next Steps',             pts:7,
    desc:'Clear close with agreed next steps' },
  { id:'disposition', n:10, icon:'📝', name:'Disposition & Notes Accuracy',     pts:5,
    desc:'Correct disposition selected and notes accurate' }
];

const TOTAL_POSSIBLE = ATTRIBUTES.reduce((t,a) => t + a.pts, 0); // 100
const answers = {};   // attributeId -> 'YES' | 'NO' | null
const CIRC = 313;

ATTRIBUTES.forEach(a => answers[a.id] = null);

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('auditDate').value = new Date().toISOString().split('T')[0];
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0)
    document.getElementById('config-banner').classList.add('show');
  renderAttributes();
  renderChips();
  refreshScore();
  warmup();
});

function warmup() {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0) return;
  try { fetch(APPS_SCRIPT_URL, { method:'GET', mode:'no-cors' }).catch(()=>{}); } catch(e){}
}

/* ─── RENDER ─────────────────────────────────── */
function renderAttributes() {
  document.getElementById('sectionsContainer').innerHTML = ATTRIBUTES.map(a => `
    <div class="section" id="sec-${a.id}">
      <div class="sec-hdr">
        <div class="sec-title"><span class="sec-icon">${a.icon}</span> ${a.n}. ${a.name}</div>
        <div class="sec-hdr-right">
          <span class="wt-badge">${a.pts}%</span>
          <div class="sec-pts" id="pts-${a.id}">${a.pts} / ${a.pts}</div>
        </div>
      </div>
      <div class="sec-body">
        <div class="yn-group" id="grp-${a.id}">
          <span class="yn-key">${a.n}</span>
          <span class="yn-lbl">${a.desc}<span style="color:var(--muted);font-weight:600;"> — ${a.pts}%</span></span>
          <div class="yn-btns">
            <button class="yn-btn yes" data-attr="${a.id}" data-val="YES">✓ Yes</button>
            <button class="yn-btn no"  data-attr="${a.id}" data-val="NO">✗ No</button>
          </div>
        </div>
      </div>
    </div>`).join('');

  document.getElementById('sectionsContainer')
    .querySelectorAll('.yn-btn').forEach(b => b.addEventListener('click', () => handleYN(b)));
  restoreSelections();
}

function restoreSelections() {
  ATTRIBUTES.forEach(a => {
    const val = answers[a.id]; if (!val) return;
    const grp = document.getElementById('grp-' + a.id); if (!grp) return;
    const btn = grp.querySelector(`.yn-btn[data-val="${val}"]`); if (!btn) return;
    btn.classList.add('active');
    grp.classList.add(val === 'YES' ? 'ay' : 'an');
  });
}

function renderChips() {
  document.getElementById('chipList').innerHTML = ATTRIBUTES.map(a =>
    `<div class="sb-chip pass" data-key="${a.id}"><span>${a.name}</span><span class="cp" id="cp-${a.id}">${a.pts}%</span></div>`
  ).join('');
}

/* ─── INTERACTION ────────────────────────────── */
function handleYN(btn) {
  const id = btn.dataset.attr, val = btn.dataset.val;
  answers[id] = val;
  const grp = btn.closest('.yn-group');
  grp.querySelectorAll('.yn-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  grp.classList.remove('ay','an');
  grp.classList.add(val === 'YES' ? 'ay' : 'an');
  refreshScore();
}

/* ─── SCORING ────────────────────────────────── */
// Starts at 100. Marking an attribute "No" removes its full weightage.
function attrEarned(a) { return answers[a.id] === 'NO' ? 0 : a.pts; }
function calcScore() {
  return Math.round(ATTRIBUTES.reduce((t,a) => t + attrEarned(a), 0) * 10) / 10;
}

function refreshScore() {
  const total = calcScore();
  document.getElementById('total-score').textContent = total;

  const arc = document.getElementById('ring-arc');
  arc.style.strokeDashoffset = CIRC - (total/TOTAL_POSSIBLE)*CIRC;
  arc.style.stroke = total>=85 ? '#4ade80' : total>=60 ? '#fbbf24' : '#f87171';

  const g = document.getElementById('score-grade'), h = document.getElementById('score-hint');
  if (total===100)    { g.style.color='#4ade80'; g.textContent='PERFECT';    h.textContent='All attributes passing'; }
  else if (total>=85) { g.style.color='#4ade80'; g.textContent='COMPLIANT';  h.textContent='Above 85% target'; }
  else if (total>=60) { g.style.color='#fbbf24'; g.textContent='NEEDS WORK'; h.textContent='Below 85% target'; }
  else                { g.style.color='#f87171'; g.textContent='CRITICAL';   h.textContent='Significant gaps found'; }

  ATTRIBUTES.forEach(a => {
    const earned = attrEarned(a);
    const pEl = document.getElementById('pts-'+a.id);
    if (pEl) { pEl.textContent = `${earned} / ${a.pts}`; pEl.className = 'sec-pts' + (earned < a.pts ? ' z' : ''); }
    const chip = document.querySelector(`.sb-chip[data-key="${a.id}"]`), cp = document.getElementById('cp-'+a.id);
    if (chip && cp) {
      cp.textContent = `${earned}/${a.pts}`;
      chip.className = 'sb-chip ' + (earned === a.pts ? 'pass' : 'fail');
    }
  });
}

/* ─── SUBMIT ─────────────────────────────────── */
function submitAudit() {
  const cn = document.getElementById('consultantName').value,
        au = document.getElementById('auditorName').value,
        zw = document.getElementById('ziwoId').value.trim(),
        hl = document.getElementById('hubspotLink').value.trim(),
        du = document.getElementById('callDuration').value.trim();

  if (!cn || !au || !zw || !hl || !du) {
    showToast('Fill in Consultant, Auditor, Ziwo ID, HubSpot link and Call duration.','error'); return;
  }
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0) {
    showToast('Sales QA web-app URL not set. Paste it into the code first.','error'); return;
  }

  const total = calcScore();
  const payload = {
    consultantName: cn, auditorName: au, auditDate: document.getElementById('auditDate').value,
    ziwoId: zw, hubspotLink: hl, callDuration: du,
    comments: document.getElementById('comments').value,
    score: total, scorePercent: total, team: TEAM
  };
  // each attribute: the answer, plus its earned/max
  ATTRIBUTES.forEach(a => {
    payload[a.id] = answers[a.id] || 'YES';
    payload['pts_' + a.id] = attrEarned(a) + '/' + a.pts;
  });

  // Optimistic: confirm + reset now, POST in the background.
  showToast('✓ Audit submitted to Google Sheet!','success');
  resetForm();

  fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(payload) })
    .then(r => r.json())
    .then(res => { if (res.status !== 'success') throw new Error(res.message || 'Unknown error'); })
    .catch(e => showToast('Submission failed — please re-enter: ' + e.message, 'error'));
}

/* ─── RESET ──────────────────────────────────── */
function resetForm() {
  ATTRIBUTES.forEach(a => answers[a.id] = null);
  ['consultantName','auditorName','ziwoId','hubspotLink','callDuration','comments'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = '';
  });
  document.getElementById('auditDate').value = new Date().toISOString().split('T')[0];
  renderAttributes();
  refreshScore();
}

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
